[project]
name = "ui_backed_components"
requires-python = ">=3.10,<3.15"
version = "0.1.0"
dependencies = [
    "dagster==1.13.26",
    "dagster-cloud>=1.13.26",
]

[project.entry-points."dagster_dg_cli.registry_modules"]
ui_backed_components = "ui_backed_components.components"

[dependency-groups]
dev = [
    "dagster-dg-cli",
    "dagster-webserver",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
force-include = { "pyproject.toml" = "pyproject.toml" }

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "ui_backed_components"
registry_modules = [
    "ui_backed_components.components.*",
]


